  ctx: null,

  init() {
    if (!this.ctx) {

if(o===p){const gx=D*HL;p.dec-=dt;let near=null,nd=99;for(const q of A[1-p.s]){if(q.gk)continue;const d=hy(p.x-q.x,p.z-q.z);if(d<nd){nd=d;near=q}}
const dg=hy(gx-p.x,p.z);
if(p.dec<=0){p.dec=rnd(.3,.7)*RK[p.s?O.diff:2];if(dg<26&&Math.random()<.55)return shoot(p);if(nd<6&&Math.random()<.65)return pass(p,Math.random()<.3)}
let tz=p.z*.8;if(near&&nd<9&&(near.x-p.x)*D>-2)tz=cl(p.z+(p.z>=near.z?12:-12),-HW+4,HW-4);
return goTo(p,dt,gx,tz,.95)}
const theirs=o&&o.s!==p.s;
if((!o||theirs)&&p.rk<2){const tx=o?o.x+o.fx:B.x+B.vx*.25,tz=o?o.z+o.fz:B.z+B.vz*.25;goTo(p,dt,tx,tz,1.05);
if(theirs&&p.tk<=0&&p.tkcd<=0&&hy(p.x-o.x,p.z-o.z)<2.2&&Math.random()<dt*(p.s?TA[O.diff]:2))doTackle(p);return}
const f=form(p);goTo(p,dt,f[0],f[1],.8)}
function gkAI(p,dt){const D=p.s?-1:1,gx=-D*(HL-2.5),o=B.owner;p.sv-=dt;p.dive-=dt;
if(o===p){p.hold-=dt;integ(p,dt,0,0);if(p.hold<=0&&S.hold<=0)pass(p,false);return}
if(S.hold>0){integ(p,dt,0,0);return}
let tz=cl(B.z*.45,-4.2,4.2),f=.9;const inc=!o&&B.vx*D<-4;
if(inc){const t=(gx-B.x)/B.vx;if(t>0&&t<2){const zp=B.z+B.vz*t;if(Math.abs(zp)<GW+2){tz=cl(zp,-GW-.5,GW+.5);f=1.9*(p.s?DK[O.diff]:1);
if(Math.abs(tz-p.z)>1.5&&p.dive<=0){p.dive=.7;p.dvz=Math.sign(tz-p.z)}}}}
if(!o&&hy(B.x-p.x,B.z-p.z)<9&&Math.abs(B.x)>HL-17&&hy(B.vx,B.vz)<8)goTo(p,dt,B.x,B.z,1.1);else goTo(p,dt,gx,tz,f);
if(!o&&p.sv<=0&&hy(p.x-B.x,p.z-B.z)<2.6&&B.y<3.6&&B.vx*D<-3){p.sv=1;p.dive=.7;p.dvz=Math.sign(B.z-p.z)||1;
if(Math.random()<(p.s?SV[O.diff]:.62)){if(hy(B.vx,B.vz)<26)take(p);else{B.vx*=-.4;B.vz=rnd(-9,9);B.vy=rnd(3,7);S.last=p.s;B.lp=p}}}}
/* ===== BALL PHYSICS ===== */
function ballStep(dt){
if(S.mode==='goal'){B.vy-=26*dt;B.y=Math.max(R,B.y+B.vy*dt);if(B.y===R)B.vy=0;const f=Math.pow(.03,dt);B.vx*=f;B.vz*=f;B.x=cl(B.x+B.vx*dt,-HL-3,HL+3);B.z=cl(B.z+B.vz*dt,-GW+.3,GW-.3);return}
const o=B.owner;
if(o){o.x=cl(o.x,-HL+1,HL-1);o.z=cl(o.z,-HW+1,HW-1);B.x=o.x+o.fx*1.3;B.z=o.z+o.fz*1.3;B.y=R+Math.abs(Math.sin(o.ph*2.2))*.25;B.vx=o.vx;B.vz=o.vz;B.vy=0;return}
const px=B.x;B.vy-=26*dt;B.x+=B.vx*dt;B.y+=B.vy*dt;B.z+=B.vz*dt;
if(B.y<R){B.y=R;if(B.vy<-3){B.vy=-B.vy*.5;B.vx*=.9;B.vz*=.9}else B.vy=0}
const f=Math.pow(B.y<=R+.05?.5:.9,dt);B.vx*=f;B.vz*=f;
if(Math.abs(B.x)>=HL&&Math.abs(px)<HL){const e=Math.sign(B.x),az=Math.abs(B.z);
if(az<GW-.3&&B.y<GH-.3)return scored(e>0?0:1);
if(az<GW+.4&&B.y<GH+.4){B.x=e*(HL-.5);B.vx*=-.45;B.vz+=rnd(-4,4);B.vy=Math.abs(B.vy)*.5+1}}
if(hy(B.vx,B.vz)>=36)for(const p of P){if(p!==B.lp&&!p.gk&&p.cd<=0&&B.y<2.6&&hy(p.x-B.x,p.z-B.z)<1.2){B.vx*=-.35;B.vz=rnd(-8,8);B.vy=rnd(2,5);p.cd=.4;S.last=p.s;break}}}
function spot(side,x,z,msg){const t=A[side].filter(p=>!p.gk).sort((a,b)=>hy(a.x-x,a.z-z)-hy(b.x-x,b.z-z))[0];
const d=hy(x,z)||1;t.x=x;t.z=z;t.vx=t.vz=0;t.fx=-x/d;t.fz=-z/d;B.owner=t;B.lp=t;S.last=side;S.hold=.9;if(side===0)ctrl=t;banner(msg,1100)}
function oob(){if(B.owner)return;const ex=Math.abs(B.x)>HL+.3,sz=Math.abs(B.z)>HW+.3;if(!ex&&!sz)return;
if(sz)return spot(1-S.last,cl(B.x,-HL+3,HL-3),Math.sign(B.z)*(HW-.5),'THROW-IN');
const e=Math.sign(B.x),def=e>0?1:0;
if(S.last===def)spot(1-def,e*(HL-1),Math.sign(B.z||1)*(HW-1),'CORNER');
else{const g=A[def][0];g.x=e*(HL-4.5);g.z=0;g.vx=g.vz=0;g.fx=-e;g.fz=0;take(g);S.hold=.5;banner('GOAL KICK',1100)}}
/* ===== UPDATE ===== */
function update(dt){const g=S.mode==='goal';
if(g){S.gt-=dt;if(S.gt<=0){S.mode='play';kickoff(1-S.gs);banner('KICK OFF',900);return}}
else{S.clock+=dt;S.hold=Math.max(0,S.hold-dt);if(S.clock>=S.dur)return over();
S.auto-=dt;if(S.auto<=0&&!(B.owner&&B.owner.s===0)){S.auto=.35;const n=A[0].filter(p=>!p.gk).sort((a,b)=>hy(a.x-B.x,a.z-B.z)-hy(b.x-B.x,b.z-B.z))[0];if(n!==ctrl&&hy(ctrl.x-B.x,ctrl.z-B.z)>hy(n.x-B.x,n.z-B.z)+5)ctrl=n}
for(const tm of A){const q=tm.filter(p=>!p.gk);q.forEach(p=>p.dB=hy(p.x-B.x,p.z-B.z));q.forEach(p=>p.rk=q.filter(o=>o.dB<p.dB).length)}}
for(const p of P){p.cd-=dt;p.stn-=dt;p.kick-=dt;p.tkcd-=dt;p.cel-=dt;
if(g){integ(p,dt,0,0);continue}
if(p.gk)gkAI(p,dt);else if(p===ctrl)human(p,dt);else ai(p,dt);if(p.tk>0)tackle(p,dt)}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],dx=b.x-a.x,dz=b.z-a.z,d=hy(dx,dz);if(d<1.4&&d>.01){const k=(1.4-d)/2/d;a.x-=dx*k;a.z-=dz*k;b.x+=dx*k;b.z+=dz*k}}
if(!g&&!B.owner){let best=null,bd=9;for(const p of P){if(p.cd>0||p.stn>0)continue;const sp=hy(B.vx,B.vz);if(p.gk&&sp>12)continue;
const d=hy(p.x-B.x,p.z-B.z);if(d<(p.gk?2.2:1.7)&&B.y<(p.gk?3:1.8)&&sp<36&&d<bd){best=p;bd=d}}if(best)take(best)}
ballStep(dt);if(!g&&S.mode==='play')oob()}
/* ===== RENDER ===== */
function anim(p,t){const sp=hy(p.vx,p.vz),s=Math.sin(p.ph*2.2)*Math.min(1,sp/6)*.9;let l1=-s;if(p.kick>0)l1=-Math.sin((1-p.kick/.3)*3.14)*1.6;
p.legs[0].rotation.x=s;p.legs[1].rotation.x=l1;p.arms[0].rotation.x=-s*.8;p.arms[1].rotation.x=s*.8;
const c=p.cel>0;p.arms[0].rotation.z=c?-2.7:0;p.arms[1].rotation.z=c?2.7:0;
const g=p.g;g.position.set(p.x,c?Math.abs(Math.sin(t*9+p.ph)):0,p.z);g.rotation.y=Math.atan2(p.fx,p.fz);g.rotation.x=p.tk>0?.9:0;g.rotation.z=0;
if(p.gk&&p.dive>0){const k=Math.sin(Math.min(1,p.dive/.7)*3.14);g.rotation.z=p.dvz*Math.sign(p.fx||1)*1.3*k;g.position.y+=k*.8}}
const CP=[[24,34],[32,44],[42,58]];let cx=0,cz=0,sbT='';
function render(dt,t){P.forEach(p=>anim(p,t));
B.m.position.set(B.x,B.y,B.z);B.m.rotation.x+=B.vz*dt/R*.5;B.m.rotation.z-=B.vx*dt/R*.5;
mk.position.set(ctrl.x,5.6+Math.sin(t*6)*.3,ctrl.z);mk.visible=S.mode==='play';crowd.offset.y=Math.sin(t*7)*.015;
const[h,d]=CP[camI],tx=S.mode==='menu'?Math.sin(t*.3)*25:cl(B.x,-HL+30,HL-30),k=Math.min(1,dt*3);cx+=(tx-cx)*k;cz+=(B.z*.3-cz)*k;
cam.position.set(cx,h,d+cz);cam.lookAt(cx,0,cz*.6);
const mm=Math.floor(S.clock/S.dur*90),s=`${CL[CLB[0]].a} <b>${S.sc[0]}</b> - <b>${S.sc[1]}</b> ${CL[CLB[1]].a}<small>${mm}' | ${ctrl.d[0]} (${ctrl.d[1]})</small>`;
if(s!==sbT){$('sb').innerHTML=s;sbT=s}ren.render(sc,cam)}
let last=0;function loop(ms){requestAnimationFrame(loop);const dt=Math.min(.033,(ms-last)/1000||0);last=ms;if(S.mode==='play'||S.mode==='goal')update(dt);render(dt,ms/1000)}
/* ===== CONTROLS ===== */
const J=$('joy'),K=$('knob');let jid=null;
function jm(e){const r=J.getBoundingClientRect(),mx=r.width/2;let dx=e.clientX-(r.left+mx),dy=e.clientY-(r.top+mx);const m=hy(dx,dy);if(m>mx){dx=dx/m*mx;dy=dy/m*mx}
K.style.transform=`translate(${dx}px,${dy}px)`;inp.x=dx/mx;inp.z=dy/mx;if(hy(inp.x,inp.z)<.15)inp.x=inp.z=0}
J.addEventListener('pointerdown',e=>{jid=e.pointerId;J.setPointerCapture(jid);jm(e)});
J.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const je=e=>{if(e.pointerId===jid){jid=null;inp.x=inp.z=0;K.style.transform='translate(0,0)'}};J.addEventListener('pointerup',je);J.addEventListener('pointercancel',je);
function own(){if(B.owner===ctrl)return true;if(!B.owner&&ctrl.cd<=0&&hy(ctrl.x-B.x,ctrl.z-B.z)<2.2&&B.y<1.8){take(ctrl);return true}return false}
function swp(){const n=A[0].filter(p=>!p.gk&&p!==ctrl).sort((a,b)=>hy(a.x-B.x,a.z-B.z)-hy(b.x-B.x,b.z-B.z))[0];if(n)ctrl=n}
const ACT={pass:()=>own()&&pass(ctrl,false),shoot:()=>own()&&shoot(ctrl),thru:()=>own()&&pass(ctrl,true),tackle:()=>{if(B.owner!==ctrl&&ctrl.tk<=0&&ctrl.tkcd<=0)doTackle(ctrl)},switch:swp};
[['PASS','pass','#2e9e4f'],['SHOOT','shoot','#d23c3c'],['THROUGH','thru','#2f6fd0'],['SPRINT','sprint','#e08a1e'],['TACKLE','tackle','#8a44c4'],['SWITCH','switch','#566']].forEach(([n,a,c])=>{
const b=document.createElement('button');b.className='b';b.textContent=n;b.style.background=c;$('btns').appendChild(b);
b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('dn');if(a==='sprint')inp.sprint=true;else if(S.mode==='play')ACT[a]()});
const up=()=>{b.classList.remove('dn');if(a==='sprint')inp.sprint=false};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
$('cam').onclick=()=>camI=(camI+1)%3;
/* ===== MENUS ===== */
const OV=$('ov');
function mark(){OV.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',String(O[b.dataset.k])===b.dataset.v))}
function ovShow(h){OV.innerHTML=h;OV.style.display='flex';mark()}
const menuH=()=>`<h1>EL CLASICO MOBILE</h1><div>Your club</div><div class=r><button data-k=club data-v=rma>Real Madrid</button><button data-k=club data-v=fcb>FC Barcelona</button></div>
<div>Difficulty</div><div class=r><button data-k=diff data-v=0>Easy</button><button data-k=diff data-v=1>Medium</button><button data-k=diff data-v=2>Hard</button></div>
<div>Match length</div><div class=r><button data-k=dur data-v=120>2 min</button><button data-k=dur data-v=180>3 min</button><button data-k=dur data-v=300>5 min</button></div>
<div class=r><button class=go data-a=go>Kick Off</button></div><p>Phase 1 prototype: other modes arrive in later phases.</p>`;
$('pause').onclick=()=>{if(S.mode!=='play')return;S.mode='pause';ovShow('<h1>PAUSED</h1><div class=r><button class=go data-a=resume>Resume</button><button data-a=restart>Restart Match</button><button data-a=menu>Main Menu</button></div>')};
OV.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.k){O[d.k]=isNaN(d.v)?d.v:+d.v;mark();return}
if(d.a==='go'||d.a==='again'||d.a==='restart'){OV.style.display='none';newMatch(true)}
else if(d.a==='resume'){OV.style.display='none';S.mode='play'}
else if(d.a==='menu'){newMatch(false);ovShow(menuH())}};
newMatch(false);ovShow(menuH());requestAnimationFrame(loop);
</script></body></html>
